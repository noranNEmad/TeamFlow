name: TeamFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test Full Stack
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Restore Backend Dependencies
      run: dotnet restore TeamFlow.slnx

    - name: Build .NET Solution
      run: dotnet build TeamFlow.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/TeamFlow.UnitTests/TeamFlow.UnitTests.csproj --configuration Release --no-build --verbosity normal

    - name: Install Frontend Dependencies
      working-directory: ./client
      run: npm ci

    - name: Build Frontend Application
      working-directory: ./client
      run: npm run build

    - name: Validate Docker Compose Configuration
      run: docker compose config
